version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project_elearningtn_network

volumes:
  postgres_data:

networks:
  project_elearningtn_network:
    driver: bridge