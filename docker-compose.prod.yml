# =============================================================================
# Déploiement PRODUCTION
# =============================================================================
# Lancer avec un fichier d'environnement dédié contenant de VRAIES valeurs :
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Différences clés avec le compose de dev :
#   - Caddy en frontal : HTTPS automatique (Let's Encrypt) sur APP_DOMAIN
#   - frontend servi par nginx (build statique) qui proxifie /api vers le backend
#   - backend en profil "prod" (ddl-auto: validate, Swagger off, cookies Secure)
#   - DB, backend ET frontend NON exposés à l'hôte : seul Caddy publie 80/443
#   - redémarrage automatique (restart: always)
# =============================================================================
services:
  db:
    image: postgres:15
    container_name: edulearn_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edulearn_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edulearn_backend_prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edulearn_network

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: edulearn_frontend_prod
    restart: always
    # Pas de "ports" exposés : Caddy parle au frontend via le réseau interne.
    depends_on:
      - backend
    networks:
      - edulearn_network

  # Reverse proxy HTTPS : TLS Let's Encrypt automatique (obtention + renouvellement).
  caddy:
    image: caddy:2-alpine
    container_name: edulearn_caddy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - edulearn_network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edulearn_network:
    driver: bridge
