# ============================================================================
# Configuration commune à tous les profils (dev / prod)
# Les surcharges spécifiques se trouvent dans application-dev.yml et
# application-prod.yml. Le profil actif est choisi via SPRING_PROFILES_ACTIVE.
# Toutes les valeurs sensibles sont injectées depuis l'environnement (.env).
# ============================================================================
spring:
  application:
    name: edulearn
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # ⚠️ Aucun défaut : valeurs obligatoires via l'environnement (.env) → fail-fast.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Envoi des emails (vérification d'inscription, réinitialisation de mot de passe).
  # ⚠️ Valeurs sensibles injectées depuis l'environnement (.env).
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  data:
    web:
      pageable:
        default-page-size: 10
        # Plafond anti-abus (durci vs le défaut Spring de 2000). Reste >= au "size"
        # utilisé pour charger toutes les options (menus déroulants, page Offres).
        max-page-size: 1000

  jpa:
    open-in-view: false              # bonne pratique : éviter LazyInitializationException
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Regroupe le chargement des associations (LAZY/EAGER non jointes) en
        # requêtes IN(...) par lots → élimine le N+1 sans casser la pagination.
        default_batch_fetch_size: 20

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  # URL du front : sert à construire les liens (vérification / réinitialisation) des emails.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${APP_MAIL_FROM:no-reply@edulearn.tn}
  verification:
    # Durées de validité (ISO-8601). PT24H = 24 h, PT30M = 30 min.
    email-token-ttl: ${VERIFICATION_EMAIL_TTL:PT24H}
    reset-token-ttl: ${VERIFICATION_RESET_TTL:PT30M}

jwt:
  # ⚠️ Obligatoire : définir JWT_SECRET (min. 32 caractères). Pas de valeur par
  # défaut ici afin que la production échoue immédiatement si le secret manque.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  cookie:
    name: ${JWT_COOKIE_NAME:access_token}
    maxAge: ${JWT_COOKIE_MAX_AGE:3600}
    secure: ${JWT_COOKIE_SECURE:false}
    sameSite: ${JWT_COOKIE_SAME_SITE:Lax}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
