server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sert uniquement les fichiers statiques React. Le HTTPS et le routage /api/
    # vers le backend sont gérés en amont par Caddy.

    # Assets buildés par Vite : le nom contient un hash de contenu, donc on peut
    # les mettre en cache « pour toujours » (un nouveau build = un nouveau nom).
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA : toute route inconnue renvoie index.html (routage React Router côté
    # client). L'index et les autres fichiers non hashés doivent être revalidés
    # à chaque visite pour que les nouveaux déploiements soient pris en compte.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
