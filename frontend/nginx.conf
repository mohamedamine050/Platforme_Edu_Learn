server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sert uniquement les fichiers statiques React. Le HTTPS et le routage /api/
    # vers le backend sont gérés en amont par Caddy.
    # SPA : toute route inconnue renvoie index.html (routage React Router côté client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
